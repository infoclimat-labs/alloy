# Values for the grafana/alloy Helm chart (operations/helm/charts/alloy) to
# run the forked Alloy image with otelcol.processor.encryption.
#
#   helm install alloy-encryption grafana/alloy -n monitoring -f values.yaml
#
# Replace the Tempo and Loki endpoints at the bottom of the configuration.

image:
  registry: ghcr.io
  repository: infoclimat-labs/alloy
  # Pin an immutable tag (encryption-poc-<commit>) or a digest for real tests.
  tag: encryption-poc
  pullPolicy: Always
  # Needed while the GHCR package is private:
  #   kubectl create secret docker-registry ghcr-pull --docker-server=ghcr.io \
  #     --docker-username=<github user> --docker-password=<token with read:packages>
  # pullSecrets:
  #   - name: ghcr-pull

controller:
  # A gateway receiving OTLP: a Deployment rather than the default DaemonSet.
  type: deployment
  replicas: 2
  volumes:
    extra:
      # Public keys of the recipients and Alloy's signing key. Never put the
      # recipients' private keys in the cluster.
      - name: encryption-keys
        secret:
          secretName: alloy-encryption-keys
          defaultMode: 0400

alloy:
  # otelcol.processor.encryption is an experimental component.
  stabilityLevel: experimental

  mounts:
    extra:
      - name: encryption-keys
        mountPath: /etc/alloy/keys
        readOnly: true

  extraPorts:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP

  configMap:
    content: |
      local.file "business_key" {
        filename = "/etc/alloy/keys/business.pub"
      }

      local.file "technical_key" {
        filename = "/etc/alloy/keys/technical.pub"
      }

      local.file "escrow_key" {
        filename = "/etc/alloy/keys/escrow.pub"
      }

      local.file "signing_key" {
        filename  = "/etc/alloy/keys/signing.key"
        is_secret = true
      }

      otelcol.receiver.otlp "default" {
        grpc {
          endpoint = "0.0.0.0:4317"
        }

        http {
          endpoint = "0.0.0.0:4318"
        }

        output {
          logs   = [otelcol.processor.encryption.gen_ai.input]
          traces = [otelcol.processor.encryption.gen_ai.input]
        }
      }

      otelcol.processor.encryption "gen_ai" {
        signing_key = local.file.signing_key.content

        rule {
          name       = "messages"
          recipients = [
            local.file.business_key.content,
            local.file.escrow_key.content,
          ]
          attributes = [
            "gen_ai.input.messages",
            "gen_ai.output.messages",
            "gen_ai.system_instructions",
            "gen_ai.prompt",
            "gen_ai.completion",
          ]
          presets = ["exceptions"]

          log_body             = true
          log_body_event_names = [
            "gen_ai.system.message",
            "gen_ai.user.message",
            "gen_ai.assistant.message",
            "gen_ai.choice",
          ]
        }

        rule {
          name       = "tools"
          recipients = [
            local.file.technical_key.content,
            local.file.escrow_key.content,
          ]
          attributes = [
            "gen_ai.tool.definitions",
            "gen_ai.tool.call.arguments",
            "gen_ai.tool.call.result",
          ]

          log_body             = true
          log_body_event_names = ["gen_ai.tool.message"]
        }

        output {
          logs   = [otelcol.processor.batch.default.input]
          traces = [otelcol.processor.batch.default.input]
        }
      }

      otelcol.processor.batch "default" {
        output {
          logs   = [otelcol.exporter.otlphttp.loki.input]
          traces = [otelcol.exporter.otlp.tempo.input]
        }
      }

      otelcol.exporter.otlp "tempo" {
        client {
          endpoint = "tempo-distributor.monitoring.svc.cluster.local:4317"

          tls {
            insecure = true
          }
        }
      }

      otelcol.exporter.otlphttp "loki" {
        client {
          endpoint = "http://loki-gateway.monitoring.svc.cluster.local/otlp"
        }
      }
